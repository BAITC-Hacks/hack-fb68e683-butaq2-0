[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "butaq-v2v"
version = "0.1.0"
description = "FastAPI voice-to-voice service with a vendored v2v package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "openai>=1.109",
    "openai-agents>=0.22.3,<0.23",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.15",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["app", "v2v", "multi-agent/src/multi_agent"]

[tool.pytest.ini_options]
testpaths = ["tests", "multi-agent/tests"]
pythonpath = ["multi-agent/src"]
asyncio_mode = "auto"
